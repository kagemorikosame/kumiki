<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Sashimono Edit</title>
  <desc>三本の木片が角で組み合って三角をなし、中の空きが再生の記号になる。</desc>

  <!--
    木を組んだ形 三本の棒が角で互い違いに重なっていて、輪になって噛み合っている
    （A の下に C、C の下に B、B の下に A）。どれか一本だけを上にすると、
    ただ重ねただけの絵になる。

    角から少し飛び出しているのは、組んだ木が出る「ほぞ」のつもり。
    全体は右を向いた三角なので、離れて見ると再生の記号にも読める。
    中央の空きがその三角。
  -->

  <defs>
    <!-- 左上の角。ここだけ A を描き足して、重なりの輪を閉じる。 -->
    <clipPath id="lap">
      <circle cx="82" cy="48.3" r="36"/>
    </clipPath>
  </defs>

  <g stroke-width="33" stroke-linecap="round" fill="none">
    <!-- A: 右上の辺。左上の角で C の上、右の角で B の下。 -->
    <line x1="69" y1="40.8" x2="233" y2="135.5" stroke="#8E9BF5"/>
    <!-- B: 右下の辺。右の角で A の上、左下の角で C の下。 -->
    <line x1="233" y1="120.5" x2="69" y2="215.2" stroke="#6C79E0"/>
    <!-- C: 左の辺。噛み合わせの要なので、ここだけ色を変える。 -->
    <line x1="82" y1="222.7" x2="82" y2="33.3" stroke="#F0A85C"/>
    <g clip-path="url(#lap)">
      <line x1="69" y1="40.8" x2="233" y2="135.5" stroke="#8E9BF5"/>
    </g>
  </g>
</svg>
