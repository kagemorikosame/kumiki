name: Qodo のレビュー

# Qodo は PR にコメントを書くだけで、GitHub のチェックを出さない そのままでは main の
# 保護で必須にできないので、Qodo のコメントを読んで「Qodo review」という status を
# 代わりに出す 判定は tools/qodo_gate.py
#
# CI（ci.yml）とは分けてある こちらはコードを検証するものではなく、verify.py に
# 足すものでもない 手元で走らせる意味が無い

on:
  pull_request:
    # edited は向き先（base）を変えたとき 変えたあとは Qodo が見直すまで待ちに戻す
    types: [opened, synchronize, reopened, edited]
  # Qodo は再レビューのたびにコメントを書き足したり書き換えたりする
  issue_comment:
    types: [created, edited]

permissions:
  # PR のコードは取り出さないので、中身を読む権限は要らない status を書くだけ
  statuses: write
  pull-requests: read
  contents: read

# 起点ごとに分ける 1 つにまとめると、push 起点の実行があとのコメント起点の実行に
# 取り消され、判定は通っているのに PR のチェック一覧に取り消し（赤）が残る
# どちらも走った時点の最新の状態を読むので、起点をまたいで並んでも結果は食い違わない
concurrency:
  group: qodo-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    # issue_comment は Issue へのコメントでも届く Issue には status を書く先のコミットが
    # 無いので、走らせても PR 番号が引けずに何もせず終わるだけで、実行の枠を無駄に使う
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # issue_comment は main のワークフローで走り、書き込みの権限を持つ PR の側の
      # コードは決して取り出さない（取り出して走らせると、外の人の PR が権限を握る）
      # 判定の道具は main のものを使う
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/qodo_gate.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Qodo が最新のコミットまで見たか
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # main にまだ判定の道具が無い（この仕組みを入れる PR 自身）ときは、失敗にせず
        # 何もしない status を出さないので、必須にしたあとは「待ち」のまま止まる
        # 失敗にすると、この仕組みを入れる PR が毎回赤く見えるだけで何も守らない
        run: |
          if [ -f tools/qodo_gate.py ]; then
            python tools/qodo_gate.py
          else
            echo "main に tools/qodo_gate.py が無いので判定しない（status も出さない）"
          fi
