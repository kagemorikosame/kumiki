# Qodo のレビューの設定
# 開発ルールの大本は docs/development.md 約束の中身は .coderabbit.yaml と同じ
#
# 使い方: PR で「/agentic_review」と書くと見る

[config]
# 返事の言語 古い PR-Agent 向けの項目で、今の Qodo（agentic review）の設定一覧には
# 載っていない（PR #14 では効かなかった） 害は無いので残し、下の指示文でも頼む
response_language = "ja-JP"

[review_agent]
issues_user_guidelines = """
【出力の言語】指摘の見出し・説明・根拠・修正の提案など、書くものはすべて日本語にしてください 英語で書かないでください
All review output (titles, descriptions, evidence, recommended fixes) must be written in Japanese

- コメントは日本語で「なぜそう書いたか」を説明するもの 何をしているかを言い換えただけのコメントは指摘する
- TODO / FIXME / XXX をコードに残さない
- 文章に句点（まる）を使わない方針 使わないのは句点だけで、読点（「、」）は使ってよい 句点は機械で検査しているので個別の指摘は不要 「句点が無いので文として不完全」「読点を空白にすべき」という指摘もしない
- src/kumiki/core/ は GUI に依存しない ここで PySide6 を import していたら指摘する
- モデル（Project / Timeline / Clip）の変更は必ず Command 経由 直接書き換えていたら指摘する
- 映像の中の座標（テキスト・影・変形・マスクの位置）は Y の上が正 画面の画素（Qt のウィジェットの座標）は下が正のままでよい
- 型は mypy strict で通る type: ignore に理由が無ければ指摘する
- テスト名とコメントに「壊れたときに何が起きるか」が書かれているか見る
- GPU・ffmpeg・特定のフォルダなど、実行する機械の状態に依存するテストは、無いときに飛ぶようになっているか見る
- 互換層（src/kumiki/compat/）は、未対応のものを黙って捨てず CompatibilityReport に記録しているか見る 1 種類読めないだけでファイル全体を例外で止めていないか 形式の判定をクラス名だけで行っているか（名前空間やアセンブリ名は版で変わる）
- CI（.github/workflows/）は手元の tools/verify.py と同じものを走らせる 片方だけに検査が増えていたら指摘する
- tests/fixtures/ の中は他人が作った配布物なので見ない
"""
compliance_user_guidelines = """
【出力の言語】ルール違反の指摘もすべて日本語で書いてください 英語で書かないでください
All compliance findings must be written in Japanese

- 文章の約束で禁じているのは句点（まる）だけ 読点（「、」）は使ってよい 読点を半角空白へ置き換えるよう求めない
- 画面の画素（Qt の座標）は下が正でよい Y の上が正の約束は、映像の中の位置についてのもの
"""
