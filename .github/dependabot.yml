# 依存の更新を自動で提案させる。
#
# 公開リポジトリなので、外から見える依存が古いままだと
# 「既知の脆弱性が放置されている」状態がそのまま晒される。

version: 2
updates:
  # GitHub Actions。ここを放置すると、CI が古い実行環境のまま動き続ける。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"

  # pip は**脆弱性の修正だけ**を受ける（版上げの PR は出させない）。
  #
  # ロックファイルが無いので、Dependabot にできるのは pyproject の下限
  # （>=2.0 など）を最新へ引き上げることだけ。下限は「これ以上なら動く」を
  # 意図して低く書いているので、上げても得るものが無く、使える環境を狭める。
  # 最初の push で 5 本来て、全部これだった。
  #
  # 脆弱性の修正（security updates）はこの設定と関係なく届く。
  # ロックファイルを入れたら（配布のパッケージングで要る）見直す。
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
