[project]
name = "novaedit"
version = "0.0.1"
description = "AviUtl 互換と AI エージェント連携を備えた Python 製の動画編集ソフト"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PySide6>=6.11",
    "av>=18.0",
    "numpy>=2.0",
    "PyOpenGL>=3.1.10",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
asr = [
    # 字幕起こしの実行環境。既定では入れない（合計で 2 GB を超えるため）。
    # ソフト内の「環境を導入」ボタンから、必要になった時点で入れる。
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9.1",
]
ai = [
    # AI 連携。既定では入れない。実行には Claude Code 本体
    # （npm install -g @anthropic-ai/claude-code）も要る。
    "claude-agent-sdk>=0.2",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.14",
    "mypy>=1.14",
]

[project.scripts]
novaedit = "novaedit.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novaedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# PyOpenGL は型情報を配布していない。GL 呼び出しは薄い層に閉じ込めてあるので、
# ここだけ型検査の対象外にする。
[[tool.mypy.overrides]]
module = ["OpenGL.*", "faster_whisper.*", "sounddevice"]
ignore_missing_imports = true
